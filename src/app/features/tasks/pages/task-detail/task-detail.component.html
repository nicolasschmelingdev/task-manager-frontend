<div class="task-detail-container">
  <!-- Loading state -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="48"></mat-spinner>
    <p>Loading task details...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="error && !loading" class="error-container">
    <mat-icon class="error-icon">error_outline</mat-icon>
    <p class="error-message">{{ error }}</p>
    <button mat-raised-button color="primary" routerLink="/tasks" class="back-button">
      <mat-icon>arrow_back</mat-icon>
      Back to Tasks
    </button>
  </div>

  <!-- Task details -->
  <div *ngIf="task && !loading" class="task-card">
    <div class="task-header">
      <div class="task-title-row">
        <h1 class="task-title">{{ task.title }}</h1>
        <div class="task-actions">
          <button mat-stroked-button color="primary" (click)="onEdit()" class="action-button">
            <mat-icon>edit</mat-icon>
            Edit
          </button>
          <button mat-stroked-button color="warn" (click)="onDelete()" class="action-button" [disabled]="loading">
            <mat-icon>delete</mat-icon>
            Delete
          </button>
        </div>
      </div>
      
      <div class="task-meta">
        <mat-chip-set>
          <mat-chip [ngClass]="getStatusClass(task.status)" class="status-chip">
            <mat-icon class="status-icon">{{ getStatusIcon(task.status) }}</mat-icon>
            {{ task.status | titlecase }}
          </mat-chip>
        </mat-chip-set>
        
        <div class="task-dates">
          <div class="date-info">
            <span class="date-label">Created:</span>
            <span class="date-value">{{ formatDate(task.createdAt) }}</span>
          </div>
          <div class="date-info" *ngIf="task.updatedAt">
            <span class="date-label">Last Updated:</span>
            <span class="date-value">{{ formatDate(task.updatedAt) }}</span>
          </div>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="task-content">
      <h3>Description</h3>
      <p class="task-description" [innerHTML]="task.description || 'No description provided.'"></p>
      
      <div class="task-meta-section" *ngIf="task.updatedBy">
        <h4>Last Updated By</h4>
        <p>{{ task.updatedBy }}</p>
      </div>
    </div>

    <div class="task-footer">
      <button mat-button routerLink="/tasks" class="back-button">
        <mat-icon>arrow_back</mat-icon>
        Back to Tasks
      </button>
    </div>
  </div>
</div>
